<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Registration System</h1>
        <p>A simple and efficient system to manage student records. Register, edit, and delete student details with ease.</p>
    </header>

    <main>
        <section id="form-section">
            <form id="registration-form">
                <div class="form-group">
                    <label for="student-name">Student Name:</label>
                    <input type="text" id="student-name" placeholder="Enter name (letters only)" required>
                </div>
                <div class="form-group">
                    <label for="student-id">Student ID:</label>
                    <input type="text" id="student-id" placeholder="Enter numeric ID" required>
                </div>
                <div class="form-group">
                    <label for="email-id">Email ID:</label>
                    <input type="email" id="email-id" placeholder="Enter valid email" required>
                </div>
                <div class="form-group">
                    <label for="contact-number">Contact Number:</label>
                    <input type="tel" id="contact-number" placeholder="At least 10 digits" required>
                </div>
                <button type="submit" id="submit-btn">Register</button>
            </form>
        </section>

        <section id="display-section">
            <h2>Registered Students</h2>
            <div id="table-container">
                <table id="student-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>ID</th>
                            <th>Email</th>
                            <th>Contact</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-list">
                        <!-- Student records will be added here dynamically -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
